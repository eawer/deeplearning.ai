[project]
dependencies = [
  "audioop-lts>=0.2.1",
  "chromadb>=1.0.13",
  "docarray[hnswlib]>=0.41.0",
  "dotenv>=0.9.9",
  "google-api-python-client>=2.169.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.2",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.7",
  "langchain-chroma>=0.2.4",
  "langchain-community>=0.3.24",
  "langchain-experimental>=0.3.4",
  "langchain-google-genai>=2.1.4",
  "langchain-ollama>=0.3.3",
  "langchain-openai>=0.3.22",
  "langchain>=0.3.25",
  "lark>=1.2.2",
  "musicbrainzngs>=0.7.1",
  "numexpr>=2.11.0",
  "openai>=1.84.0",
  "pandas>=2.3.0",
  "pre-commit>=4.2.0",
  "pydantic>=2.11.4",
  "pydub>=0.25.1",
  "pylance>=0.29.0",
  "pypdf>=5.6.0",
  "scikit-learn>=1.7.0",
  "simpleaudio>=1.0.4",
  "tiktoken>=0.9.0",
  "tox-uv>=1.26.0",
  "tox>=4.27.0",
  "transformers>=4.52.4",
  "wikipedia>=1.4.0",
  "youtube-transcript-api>=1.0.3",
  "yt-dlp>=2025.6.9",
]
description = "Add your description here"
name = "deeplearning-ai"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[dependency-groups]
dev = [
  "pre-commit>=4.2.0",
  "ruff>=0.12.0",
  "toml-sort>=0.24.2",
  "yamllint>=1.37.1"
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]

[tool.tox]
env_list = ["fix"]
requires = ["tox>=4.27"]

[tool.tox.env.fix]
commands = [
    ["uv", "run", "ruff", "format", "."],
    ["uv", "run", "ruff", "check", "--fix", "."]
]
description = "run code formatter and linter (auto-fix)"
install_deps = "."
py_dot_ver = 3.13
runner = "uv-venv-lock-runner"
