services:
  openwebui:
    container_name: openwebui
    image: ghcr.io/open-webui/open-webui:ollama
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - 3000:8080
      - 11434:11434
    environment:
      - OLLAMA_HOST=0.0.0.0
    shm_size: '2gb'
    volumes:
      - ollama:/root/.ollama
      - open-webui:/app/backend/data

  # MLFLOW SECTION
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mlflowdb
    volumes:
      - mlflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mlflowdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    expose:
      - "9000"
    environment:
      MINIO_ROOT_USER: "user"
      MINIO_ROOT_PASSWORD: "password"
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 1s
      timeout: 10s
      retries: 5
    command: server /data --console-address ":9001"

  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      bash -c "
      mc alias set minio http://minio:9000 user password &&
      if ! mc ls minio/bucket; then
        mc mb minio/bucket
      else
        echo 'bucket already exists'
      fi
      "
  mlflow:
    build:
      dockerfile: ../../dockerfiles/Dockerfile.mlflow
    ports:
      - 5000:5000
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=user
      - AWS_SECRET_ACCESS_KEY=password
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["mlflow", "server", "--backend-store-uri", "postgresql://user:password@postgres:5432/mlflowdb", "--artifacts-destination", "s3://bucket", "--host", "0.0.0.0", "--port", "5000"] # trufflehog:ignore

volumes:
  ollama:
  open-webui:
  mlflow-pg:
